version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: bhoomi_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bhoomi_secure_password
      POSTGRES_DB: bhoomi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomi_backend
    environment:
      - DATABASE_URL=postgresql://postgres:bhoomi_secure_password@db:5432/bhoomi_db
      - SECRET_KEY=bhoomi-prod-secret-key-sih2026-mord
      - STORAGE_PATH=/app/data/storage
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
